<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Wheelhouse</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c96442" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/panels.css" />
    <script src="/js/theme-boot.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <div id="scrim" class="scrim" aria-hidden="true"></div>
      <aside id="sidebar" class="sidebar" aria-label="Sessions"></aside>
      <div class="resizer" id="sidebar-resizer" aria-hidden="true"></div>
      <main id="main" class="main">
        <header id="topbar" class="topbar"></header>
        <section id="chat" class="chat"></section>
        <div id="dock" class="dock"></div>
      </main>
      <div class="resizer" id="inspector-resizer" aria-hidden="true"></div>
      <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
    </div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
